name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Transport tests (retries, throttling, token refresh, timeouts)
        run: node test/client.mjs

      - name: Smoke test (MCP protocol, multi-store wiring, failure paths)
        run: node test/smoke.mjs
